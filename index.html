<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#111;background:#fafafa}

.ib{position:relative;flex:none;background:#111;color:#fff;border:0;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}.ib span{position:absolute;top:-4px;right:-4px;background:#e11d48;color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;font-weight:700}

.hero{text-align:center;padding:60px 20px;background:#111;color:#fff}.hero h1{margin:0 0 20px;font-size:clamp(26px,5vw,44px)}.hero a{background:#fff;color:#111;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:700}

.card{background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden;cursor:pointer}.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#eee;display:block}
.card .bd{padding:12px}.pf{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.plus{width:36px;height:36px;border-radius:50%;border:0;background:#111;color:#fff;font-size:22px;line-height:1}
.sw{display:inline-flex;align-items:center;gap:6px;border:1px solid #ccc;background:#fff;border-radius:20px;padding:5px 12px;font-size:13px;margin:0 6px 6px 0}.sw i{width:16px;height:16px;border-radius:50%;border:1px solid #0003;display:inline-block}.sw.on{border-color:#111;box-shadow:0 0 0 2px #111}

.ov{position:fixed;inset:0;background:#0008;display:none;z-index:20;overflow:auto}.ov>div{background:#fff;max-width:640px;margin:30px auto;padding:22px;border-radius:14px;position:relative}
.x{position:absolute;right:12px;top:8px;border:0;background:0;font-size:26px}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit;margin:3px 0 8px}label{font-size:13px;color:#555}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.th{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.th img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid #ddd;cursor:pointer}
.main-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}

.tb{background:0;border:0;color:#ccc;padding:6px 10px}.tb.on{color:#fff;border-bottom:2px solid #fff}.pad{padding:18px;max-width:1100px;margin:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}.kp div{background:#fff;padding:16px;border-radius:12px}.kp b{font-size:26px;display:block}
.tw{overflow-x:auto;background:#fff;border-radius:10px;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}th{background:#fafafa}
.fm{background:#fff;padding:16px;border-radius:12px;margin:10px 0}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;z-index:50;display:none}
@media(max-width:600px){main{padding:18px 10px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card .bd{padding:8px;font-size:13px}.card .bd small{font-size:11px}.pr{font-size:15px}.plus{width:30px;height:30px;font-size:18px}.hero{padding:40px 16px}}
</style></head><body>
<div id="bar"></div>
<header><img src="logo.png" alt="ROUMANS"><nav id="chips"></nav><button class="ib" onclick="cartUI()" aria-label="Bolsa de compras"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span id="cn" style="display:none">0</span></button></header>

<script>
const API='https://script.google.com/macros/s/AKfycbwZCEVOcMgCrp7p0eCaqMANx0IG8Fcxd9KdbQLVkuEXE_V0MSHv2270GV3St81R7k1l/exec'; // ← URL de implementación de Apps Script (termina en /exec)
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),m=n=>'$'+(+n||0).toFixed(2);
const S={p:[],cfg:{},cart:[],A:null,key:'',cat:'Todas'};
const BAD=API=>API.startsWith('PEGA')?'Falta pegar la URL del Web App en index.html (const API)':!/script\.google\.com\/macros\/s\/.+\/exec/.test(API)?'La URL debe ser la de Apps Script y terminar en /exec':'';
const api=async o=>{
  const b=BAD(API);if(b)return{ok:0,error:b};
  try{const t=await(await fetch(API,{method:'POST',body:JSON.stringify(o)})).text();
    try{return JSON.parse(t)}catch{return{ok:0,error:'La URL no devolvió datos: en la implementación usa acceso "Cualquier persona" y publica una nueva versión'}}
  }catch(x){return{ok:0,error:'Sin conexión con la hoja: revisa que la URL sea la /exec y que el acceso sea "Cualquier persona"'}}};
const cols=p=>{try{return Array.isArray(p.colores)?p.colores:JSON.parse(p.colores||'[]')}catch{return[]}};let CP=null,SEL='';
const imgs=p=>{try{return Array.isArray(p.imagenes)?p.imagenes:JSON.parse(p.imagenes||'[]')}catch{return[]}};
const toast=t=>{const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',2800)};
const show=h=>{$('#ovc').innerHTML='<button class="x" onclick="hide()">×</button>'+h;$('#ov').style.display='block'},hide=()=>$('#ov').style.display='none';
const rz=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82).split(',')[1])};i.src=URL.createObjectURL(f)});
const now=()=>new Date().toLocaleString('sv').slice(0,16);
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}`).join('')}${r.map(x=>`<tr>${x.map(c=>`<td>${c}`).join('')}`).join('')}</table></div>`;

/* ===== TIENDA PÚBLICA ===== */
async function load(){
  const b=BAD(API);if(b){$('#grid').innerHTML='<p>'+b+'.</p>';return}
  try{const r=JSON.parse(await(await fetch(API)).text());if(!r.ok)throw 0;S.p=r.productos;S.cfg=r.config;paint()}
  catch(x){$('#grid').innerHTML='<p>No se pudo cargar el catálogo. Abre la URL del Web App en el navegador: debe mostrar datos y no una página de inicio de sesión. Revisa que el acceso sea "Cualquier persona" y que hayas publicado una nueva versión.</p>'}
}
const IC={fb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>',
ig:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM17.6 5.9a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z"/></svg>',
tt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 6.7a4.8 4.8 0 0 1-3.8-4.2h-3.3v13.3a2.8 2.8 0 1 1-2-2.7V9.7a6.1 6.1 0 1 0 5.3 6V9.4a8 8 0 0 0 3.8 1.2z"/></svg>',
wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.200 5.200 0 0 0 1.100 2.800c.1.2 2.100 3.300 5.200 4.600 1.900.8 2.700.9 3.600.7.600-.1 1.700-.7 2-1.400.2-.7.2-1.200.2-1.300-.1-.1-.3-.2-.5-.3z"/></svg>'};
function social(){
  const L=[['https://www.facebook.com/61572463497545/','fb','Facebook'],['https://www.instagram.com/roumans.ec/','ig','Instagram'],['https://www.tiktok.com/@roumans.ec','tt','TikTok']];
  const w=String(S.cfg.whatsapp||'').replace(/\D/g,'');if(w)L.push(['https://wa.me/'+w,'wa','WhatsApp']);
  $('#soc').innerHTML=L.map(x=>`<a ${x[1]=='wa'?'class="wa" ':''}href="${x[0]}" target="_blank" rel="noopener" aria-label="${x[2]}" title="${x[2]}">${IC[x[1]]}</a>`).join('');
}
function paint(){social();
  $('#bar').textContent=S.cfg.anuncio||'';$('#hero').textContent=S.cfg.hero||'';
  const cats=['Todas',...new Set(S.p.map(p=>p.categoria).filter(Boolean))];
  $('#chips').innerHTML=cats.map(c=>`<button class="${c==S.cat?'on':''}" onclick="S.cat='${e(c)}';paint()">${e(c)}</button>`).join('');
  const l=S.p.filter(p=>S.cat=='Todas'||p.categoria==S.cat);
  $('#grid').innerHTML=l.map(p=>{const i=imgs(p)[0];return`<div class="card" onclick="prod('${e(p.sku)}')">${i?`<img src="${e(i)}" loading="lazy">`:'<div class="ph"></div>'}<div class="bd"><small>${e(p.categoria)}</small><br>${e(p.nombre)}<div class="pf"><span class="pr">${m(p.precio)}</span>${+p.stock<=0?'<small>Agotado</small>':`<button class="plus" aria-label="Agregar" onclick="event.stopPropagation();quick('${e(p.sku)}')">+</button>`}</div></div></div>`}).join('')||'<p>Sin productos disponibles.</p>';
  const n=S.cart.reduce((a,x)=>a+x.qty,0);$('#cn').textContent=n;$('#cn').style.display=n?'block':'none';
}
function prod(sku){
  const p=S.p.find(x=>x.sku==sku),im=imgs(p),co=cols(p);CP=p;SEL=(co[0]||{}).n||'';
  show(`${im[0]?`<img class="main-img" id="mi" src="${e(im[0])}">`:''}<div class="th">${im.map(u=>`<img src="${e(u)}" onclick="$('#mi').src=this.src">`).join('')}</div>
  <small>${e(p.categoria)} · Código ${e(p.sku)}</small><h2>${e(p.nombre)}</h2><div class="pr">${m(p.precio)} USD</div><p>${e(p.descripcion)}</p>
  ${co.length?`<label>Color</label><div class="th" id="cs">${co.map((c,i)=>`<button class="sw ${i?'':'on'}" onclick="selCol(${i})"><i style="background:${e(c.h)}"></i>${e(c.n)}</button>`).join('')}</div>`:''}
  <label>Cantidad</label><input type="number" id="q" value="1" min="1" max="${+p.stock}">
  <button class="b1" ${+p.stock<=0?'disabled':''} onclick="add('${e(p.sku)}')">${+p.stock<=0?'Agotado':'Agregar a la bolsa'}</button>`);
}
function selCol(i){SEL=cols(CP)[i].n;document.querySelectorAll('#cs .sw').forEach((b,j)=>b.classList.toggle('on',j==i))}
function quick(sku){const p=S.p.find(x=>x.sku==sku);if(cols(p).length)return prod(sku);const c=S.cart.find(x=>x.sku==sku&&!x.color);if((c?c.qty:0)+1>+p.stock)return toast('Stock disponible: '+p.stock);c?c.qty++:S.cart.push({sku,qty:1});paint();toast('Agregado a la bolsa')}
function add(sku){
  const p=S.p.find(x=>x.sku==sku),q=Math.max(1,+$('#q').value||1),color=SEL,c=S.cart.find(x=>x.sku==sku&&(x.color||'')==color),tq=S.cart.filter(x=>x.sku==sku).reduce((a,x)=>a+x.qty,0);
  if(tq+q>+p.stock)return toast('Stock disponible: '+p.stock);
  c?c.qty+=q:S.cart.push({sku,qty:q,color});hide();paint();toast('Agregado a la bolsa');
}
const tot=()=>{const s=S.cart.reduce((a,x)=>a+x.qty*S.p.find(p=>p.sku==x.sku).precio,0),i=s*(+S.cfg.iva||0)/100;return{s,i,t:s+i}};
function cartUI(){
  if(!S.cart.length)return show('<h2>Tu Bolsa ROUMANS</h2><p>Tu bolsa está vacía.</p>');
  const t=tot();
  show(`<h2>Tu Bolsa ROUMANS</h2>${S.cart.map((x,i)=>{const p=S.p.find(q=>q.sku==x.sku);return`<div class="row"><span>${e(p.nombre)}${x.color?' · '+e(x.color):''}<br><small>${m(p.precio)}</small></span><span><button class="b2" onclick="qty(${i},-1)">−</button> ${x.qty} <button class="b2" onclick="qty(${i},1)">+</button></span></div>`}).join('')}
  <h3>Datos del cliente</h3><label>Cédula / RUC *</label><div style="display:flex;gap:6px"><input id="c1"><button class="b2" onclick="findC()">Buscar</button></div>
  <div class="g2"><div><label>Teléfono / WhatsApp *</label><input id="c2"></div><div><label>Nombres / Razón social *</label><input id="c3"></div></div>
  <label>Correo</label><input id="c4"><label>Método de pago *</label><select id="c5"><option>Transferencia Bancaria<option>Efectivo / Contra entrega<option>Tarjeta de Crédito / Débito</select>
  <pre style="background:#f4f4f4;padding:8px;border-radius:8px;white-space:pre-wrap">${e(S.cfg.banco)}</pre>
  <label>Dirección de entrega / Ciudad *</label><input id="c6"><label>Observación</label><input id="c7">
  <p>Subtotal ${m(t.s)}<br>IVA (${+S.cfg.iva||0}%) ${m(t.i)}<br><b style="font-size:20px">Total ${m(t.t)} USD</b></p>
  <button class="b1" id="ok" onclick="order()">Confirmar pedido</button>`);
}
function qty(i,d){const x=S.cart[i],p=S.p.find(q=>q.sku==x.sku);x.qty+=d;if(x.qty>+p.stock){x.qty=+p.stock;toast('Stock máximo')}if(x.qty<=0)S.cart.splice(i,1);paint();cartUI()}
async function findC(){const r=await api({action:'client',cedula:$('#c1').value.trim()});if(r.cliente){$('#c2').value=r.cliente.telefono;$('#c3').value=r.cliente.nombre;$('#c4').value=r.cliente.correo;$('#c6').value=r.cliente.direccion}else toast('Cliente nuevo')}
async function order(){
  const c={cedula:$('#c1').value.trim(),telefono:$('#c2').value.trim(),nombre:$('#c3').value.trim(),correo:$('#c4').value.trim(),direccion:$('#c6').value.trim()};
  if(!c.cedula||!c.telefono||!c.nombre||!c.direccion)return toast('Completa los campos obligatorios (*)');
  $('#ok').disabled=true;$('#ok').textContent='Procesando…';
  const r=await api({action:'order',cliente:c,items:S.cart,pago:$('#c5').value,obs:$('#c7').value,canal:'Web'});
  if(!r.ok){toast(r.error);$('#ok').disabled=false;$('#ok').textContent='Confirmar pedido';return}
  const txt=`Hola ROUMANS, pedido ${r.id}\nCliente: ${c.nombre} (${c.cedula})\n`+r.items.map(i=>`- ${i.qty} x ${i.nombre}${i.color?' ('+i.color+')':''}`).join('\n')+`\nTotal: ${m(r.total)} USD\nPago: ${$('#c5').value}\nEntrega: ${c.direccion}`;
  {const sb=r.items.reduce((a,i)=>a+i.qty*i.precio,0);LAST={id:r.id,fecha:now(),cli:c,items:r.items,pago:$('#c5').value,obs:$('#c7').value,sub:sb,iva:+r.total-sb,total:+r.total}}
  S.cart=[];load();
  show(`<h2>¡Pedido registrado!</h2><p>N° ${e(r.id)} · Total ${m(r.total)} USD</p>${S.cfg.whatsapp?`<a class="b1" style="display:inline-block;text-decoration:none" target="_blank" href="https://wa.me/${e(S.cfg.whatsapp)}?text=${encodeURIComponent(txt)}">Enviar comprobante por WhatsApp</a>`:''} <button class="b1" onclick="pdf(LAST)">Descargar comprobante PDF</button> <button class="b2" onclick="hide()">Seguir comprando</button>`);
}


/* ===== COMPROBANTE PDF ===== */
let LAST=null,JP=null;
const loadPdf=()=>JP||(JP=new Promise((ok,no)=>{if(window.jspdf)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=ok;s.onerror=()=>{JP=null;no()};document.head.appendChild(s)}));
const logoData=()=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;c.getContext('2d').drawImage(i,0,0);r({d:c.toDataURL('image/png'),w:i.width,h:i.height})};i.onerror=()=>r(null);i.src='logo.png'});
async function pdf(v){
  try{await loadPdf()}catch{return toast('No se pudo cargar el generador de PDF (revisa tu conexión)')}
  toast('Generando comprobante…');
  const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),L=await logoData();let y=14;
  if(L){const w=62,hh=w*L.h/L.w;d.addImage(L.d,'PNG',15,y,w,hh);y+=hh}else{d.setFontSize(22).setFont('helvetica','bold').text('ROUMANS',15,y+8);y+=10}
  d.setTextColor(0).setFont('helvetica','bold').setFontSize(13).text('COMPROBANTE DE PEDIDO',195,18,{align:'right'});
  d.setFont('helvetica','normal').setFontSize(10).text('N° '+v.id,195,24,{align:'right'}).text('Fecha: '+v.fecha,195,29,{align:'right'});
  y+=8;d.setDrawColor(17).setLineWidth(.6).line(15,y,195,y);y+=7;
  const c=v.cli||{};d.setFont('helvetica','bold').text('CLIENTE',15,y);d.setFont('helvetica','normal');y+=5.5;
  [['Nombre',c.nombre],['Cédula / RUC',c.cedula],['Teléfono',c.telefono],['Dirección',c.direccion],['Pago',v.pago]].forEach(([k,x])=>{if(!x)return;const t=d.splitTextToSize(String(x),140);d.text(k+':',15,y);d.text(t,45,y);y+=5*t.length});
  y+=4;d.setFillColor(17,17,17).rect(15,y,180,8,'F');d.setTextColor(255).setFont('helvetica','bold');
  d.text('Cant.',18,y+5.5).text('Descripción',32,y+5.5).text('P. unit.',158,y+5.5,{align:'right'}).text('Total',192,y+5.5,{align:'right'});
  y+=14;d.setTextColor(0).setFont('helvetica','normal');
  v.items.forEach(i=>{const t=d.splitTextToSize(i.nombre+(i.color?' ('+i.color+')':''),112);
    if(y+t.length*5>265){d.addPage();y=20}
    d.text(String(i.qty),18,y).text(t,32,y).text(m(i.precio),158,y,{align:'right'}).text(m(i.qty*i.precio),192,y,{align:'right'});
    y+=t.length*5+1.5;d.setDrawColor(225).setLineWidth(.2).line(15,y-3,195,y-3);y+=1.5});
  if(y>235){d.addPage();y=20}y+=4;
  d.text('Subtotal',150,y,{align:'right'}).text(m(v.sub),192,y,{align:'right'});y+=6;
  d.text('IVA ('+(+S.cfg.iva||0)+'%)',150,y,{align:'right'}).text(m(v.iva),192,y,{align:'right'});y+=8;
  d.setFont('helvetica','bold').setFontSize(13).text('TOTAL',150,y,{align:'right'}).text(m(v.total)+' USD',192,y,{align:'right'});y+=10;
  if(v.obs){d.setFont('helvetica','normal').setFontSize(10).text(d.splitTextToSize('Observación: '+v.obs,180),15,y);y+=10}
  d.setFont('helvetica','normal').setFontSize(9).setTextColor(110);
  const w=String(S.cfg.whatsapp||'').replace(/\D/g,'');
  d.text('Gracias por tu compra en ROUMANS'+(w?'  ·  WhatsApp: +'+w:'')+'  ·  @roumans.ec',105,285,{align:'center'});
  d.save('Comprobante-'+v.id+'.pdf');
}
function pdfV(id){const v=S.A.VENTAS.find(x=>x.id==id);let it=[];try{it=JSON.parse(v.items)}catch{}
  pdf({id:v.id,fecha:v.fecha,cli:{nombre:v.cliente,cedula:v.cedula,telefono:v.telefono,direccion:v.direccion},items:it,pago:v.pago,obs:v.obs,sub:+v.subtotal,iva:+v.iva,total:+v.total})}

/* ===== ADMIN ===== */
function loginUI(){show('<h2>Acceso administrador</h2><label>Clave de acceso</label><input type="password" id="k" onkeydown="if(event.key==\'Enter\')login()"><button class="b1" onclick="login()">Ingresar</button>')}
async function login(){S.key=$('#k').value;if(!await adminLoad())return;hide();admin()}
async function adminLoad(){const r=await api({action:'admin',key:S.key});if(!r.ok){toast(r.error);return false}S.A=r;return true}
async function sync(){if(await adminLoad()){admin();load();toast('Sincronizado')}}
const TABS=['Resumen','Productos','Inventario','Ventas','Clientes','Config'];let tab='Resumen',F=null;
function admin(){
  $('#adm').style.display='block';
  $('#adm').innerHTML=`<div class="top"><b>ROUMANS ADMIN</b><span>${TABS.map(t=>`<button class="tb ${t==tab?'on':''}" onclick="tab='${t}';F=null;admin()">${t}</button>`).join('')}</span><span><button class="b2" onclick="sync()">Sincronizar</button><button class="b2" onclick="$('#adm').style.display='none';history.replaceState(null,'',location.pathname)">Ver tienda</button></span></div><div class="pad">${V[tab]()}</div>`;
}
const kp=(a,b)=>`<div>${a}<b>${b}</b></div>`;
const inp=(k,l,t='text')=>`<div><label>${l}</label><input type="${t}" value="${e(F[k])}" oninput="F.${k}=this.value"></div>`;
const V={
Resumen(){const A=S.A,low=A.PRODUCTOS.filter(x=>+x.stock<=+x.minimo);
  return`<div class="kp">${kp('Ingresos por ventas',m(A.VENTAS.reduce((a,x)=>a+ +x.total,0)))}${kp('Valor inventario (costo)',m(A.PRODUCTOS.reduce((a,x)=>a+x.costo*x.stock,0)))}${kp('Alertas de stock bajo',low.length)}${kp('Clientes',A.CLIENTES.length)}</div><h3>Productos con stock bajo</h3>${tbl(['Producto','Stock','Mínimo'],low.map(x=>[e(x.nombre),x.stock,x.minimo]))}`},
Productos(){
  if(F)return`<div class="fm"><h3>${F._i!=null?'Editar':'Nuevo'} producto</h3><div class="g2">${inp('sku','Código SKU *')}${inp('barcode','Código de barras')}${inp('nombre','Nombre *')}${inp('categoria','Categoría *')}${inp('costo','Costo','number')}${inp('precio','Precio venta *','number')}${inp('stock','Stock actual *','number')}${inp('minimo','Stock mínimo','number')}${inp('unidad','Unidad')}</div>
  <label>Descripción</label><textarea rows="3" oninput="F.descripcion=this.value">${e(F.descripcion)}</textarea>
  <h4>Colores disponibles</h4><div class="th">${F.colores.map((c,i)=>`<span class="sw"><i style="background:${e(c.h)}"></i>${e(c.n)} <button class="b2" onclick="F.colores.splice(${i},1);admin()">×</button></span>`).join('')||'<small>Sin colores (opcional)</small>'}</div>
  <div style="display:flex;gap:6px"><input type="color" id="chx" value="#000000" style="width:56px;padding:2px"><input id="chn" placeholder="Nombre del color (ej. Negro)" onkeydown="if(event.key=='Enter')addCol()"><button class="b2" onclick="addCol()">+ Añadir color</button></div>
  <label><input type="checkbox" style="width:auto" ${F.visible=='SI'?'checked':''} onchange="F.visible=this.checked?'SI':'NO'"> Visible en tienda pública</label>
  <h4>Galería (${F.imagenes.length}/8) — la #1 es la portada</h4><div class="th">${F.imagenes.map((u,i)=>`<div><img src="${e(u)}"><br><button class="b2" onclick="F.imagenes.splice(${i},1);admin()">Quitar</button>${i?`<button class="b2" onclick="F.imagenes.unshift(F.imagenes.splice(${i},1)[0]);admin()">★</button>`:''}</div>`).join('')}</div>
  <input type="file" accept="image/*" multiple onchange="up(this)"><div style="display:flex;gap:6px"><input id="url" placeholder="o pega un enlace de imagen (URL)"><button class="b2" onclick="if($('#url').value&&F.imagenes.length<8){F.imagenes.push($('#url').value);admin()}">Añadir</button></div>
  <button class="b1" onclick="saveP()">Guardar producto</button> <button class="b2" onclick="saveP(true)">Guardar y añadir otro (+)</button> <button class="b2" onclick="F=null;admin()">Cancelar</button></div>`;
  return`<button class="b1" onclick="F={visible:'SI',unidad:'Unidad',imagenes:[],colores:[]};admin()">+ Nuevo producto</button>`+tbl(['','SKU','Producto','Categoría','Fotos','Precio','Stock',''],S.A.PRODUCTOS.map((x,i)=>[imgs(x)[0]?`<img src="${e(imgs(x)[0])}" width="40">`:'',e(x.sku),e(x.nombre),e(x.categoria),imgs(x).length,m(x.precio),x.stock,`<button class="b2" onclick="F={...S.A.PRODUCTOS[${i}],imagenes:imgs(S.A.PRODUCTOS[${i}]),colores:cols(S.A.PRODUCTOS[${i}]),_i:${i}};admin()">Editar</button><button class="b2" onclick="delP(${i})">Borrar</button>`]))},
Inventario(){const A=S.A;
  return`<div class="fm"><h3>Movimiento de inventario</h3><div class="g2"><div><label>Producto</label><select id="as">${A.PRODUCTOS.map(p=>`<option value="${e(p.sku)}">${e(p.nombre)} (stock ${p.stock})`).join('')}</select></div><div><label>Tipo</label><select id="at"><option value="ENTRADA">ENTRADA (+)<option value="SALIDA">SALIDA (−)<option value="AJUSTE">FIJAR STOCK EXACTO</select></div><div><label>Cantidad</label><input type="number" id="aq"></div><div><label>Motivo</label><input id="am"></div></div><button class="b1" onclick="adj()">Aplicar ajuste</button></div>
  <h3>Kardex</h3>${tbl(['Fecha','Producto','Tipo','Cant.','Anterior → Nuevo','Motivo'],[...A.KARDEX].reverse().slice(0,200).map(k=>[e(k.fecha),e(k.producto),e(k.tipo),k.cantidad,k.anterior+' → '+k.nuevo,e(k.motivo)]))}`},
Ventas(){const A=S.A;
  return`<div class="fm"><h3>Venta directa (mostrador)</h3><div class="g2"><div><label>Cédula / RUC</label><input id="v1"></div><div><label>Cliente</label><input id="v2" value="Consumidor final"></div><div><label>Producto</label><select id="v3">${A.PRODUCTOS.map(p=>`<option value="${e(p.sku)}">${e(p.nombre)} (${p.stock})`).join('')}</select></div><div><label>Cantidad</label><input type="number" id="v4" value="1"></div><div><label>Pago</label><select id="v5"><option>Efectivo<option>Transferencia<option>Tarjeta</select></div></div><button class="b1" onclick="manual()">Emitir venta y descontar stock</button></div>
  ${tbl(['N°','Fecha','Cliente','Artículos','Pago','Total','Estado','Comprobante'],[...A.VENTAS].reverse().map(v=>{let it='';try{it=JSON.parse(v.items).map(i=>i.qty+'× '+i.nombre+(i.color?' ('+i.color+')':'')).join(', ')}catch{}return[e(v.id),e(v.fecha),e(v.cliente),e(it),e(v.pago),m(v.total),`<button class="b2" onclick="est('${e(v.id)}')">${e(v.estado)}</button>`,`<button class="b2" onclick="pdfV('${e(v.id)}')">PDF</button>`]}))}`},
Clientes(){
  if(!F)F={cedula:'',nombre:'',telefono:'',correo:'',direccion:''};
  return`<div class="fm"><h3>Crear / editar cliente</h3><div class="g2">${inp('cedula','Cédula / RUC *')}${inp('nombre','Nombres / Razón social *')}${inp('telefono','Teléfono *')}${inp('correo','Correo')}${inp('direccion','Dirección')}</div><button class="b1" onclick="saveC()">Guardar cliente</button></div>`+tbl(['Cédula','Nombres','Teléfono','Correo','Dirección',''],S.A.CLIENTES.map((c,i)=>[e(c.cedula),e(c.nombre),e(c.telefono),e(c.correo),e(c.direccion),`<button class="b2" onclick="F={...S.A.CLIENTES[${i}]};admin()">Editar</button><button class="b2" onclick="delC(${i})">Borrar</button>`]))},
Config(){const c=S.A.config;
  return`<div class="fm"><h3>Configuración de la tienda</h3><label>Impuesto IVA (%)</label><input id="f1" type="number" value="${e(c.iva)}"><label>WhatsApp de la tienda — icono público y pedidos (con código de país, ej. 593999999999)</label><input id="f2" value="${e(c.whatsapp)}"><label>Barra de anuncio</label><input id="f3" value="${e(c.anuncio)}"><label>Título principal</label><input id="f4" value="${e(c.hero)}"><label>Datos bancarios</label><textarea id="f5" rows="4">${e(c.banco)}</textarea><label>Nueva clave de administrador (vacío = no cambiar)</label><input id="f6" type="password"><button class="b1" onclick="saveCfg()">Guardar configuración</button></div>`}
};
function addCol(){const n=$('#chn').value.trim();if(!n)return toast('Escribe el nombre del color');F.colores.push({n,h:$('#chx').value});admin()}
async function up(inp){
  for(const f of [...inp.files]){if(F.imagenes.length>=8)break;toast('Subiendo imagen…');const r=await api({action:'upload',key:S.key,data:await rz(f)});r.ok?F.imagenes.push(r.url):toast(r.error)}admin();
}
async function saveTable(t,rows){const r=await api({action:'save',key:S.key,table:t,rows});if(!r.ok)toast(r.error);else toast('Guardado');return r.ok}
async function saveP(more){
  if(!F.sku||!F.nombre||F.precio==null)return toast('Completa SKU, nombre y precio');
  const o={...F,imagenes:JSON.stringify(F.imagenes),colores:JSON.stringify(F.colores)};delete o._i;const l=[...S.A.PRODUCTOS];
  if(F._i!=null)l[F._i]=o;else if(l.some(x=>x.sku==o.sku))return toast('SKU repetido');else l.push(o);
  if(await saveTable('PRODUCTOS',l)){S.A.PRODUCTOS=l;F=more?{visible:'SI',unidad:'Unidad',imagenes:[],colores:[]}:null;admin();load()}
}
async function delP(i){if(!confirm('¿Borrar producto?'))return;const l=S.A.PRODUCTOS.filter((_,j)=>j!=i);if(await saveTable('PRODUCTOS',l)){S.A.PRODUCTOS=l;admin();load()}}
async function adj(){
  const p=S.A.PRODUCTOS.find(x=>x.sku==$('#as').value),t=$('#at').value,q=+$('#aq').value;if(!p||isNaN(q)||$('#aq').value==='')return toast('Indica la cantidad');
  const a=+p.stock,n=t=='ENTRADA'?a+q:t=='SALIDA'?a-q:q;if(n<0)return toast('Stock no puede ser negativo');p.stock=n;
  const k={fecha:now(),sku:p.sku,producto:p.nombre,tipo:t,cantidad:q,anterior:a,nuevo:n,motivo:$('#am').value||'Ajuste manual'};
  if(await saveTable('PRODUCTOS',S.A.PRODUCTOS)){await api({action:'append',key:S.key,table:'KARDEX',rows:[k]});S.A.KARDEX.push(k);admin();load()}
}
async function manual(){
  const r=await api({action:'order',canal:'Mostrador',pago:$('#v5').value,cliente:{cedula:$('#v1').value.trim(),nombre:$('#v2').value},items:[{sku:$('#v3').value,qty:+$('#v4').value}]});
  if(!r.ok)return toast(r.error);toast('Venta '+r.id+' registrada');await adminLoad();admin();load()
}
async function est(id){const l=S.A.VENTAS,v=l.find(x=>x.id==id);v.estado=v.estado=='Pendiente'?'Entregado':'Pendiente';if(await saveTable('VENTAS',l))admin()}
async function saveC(){
  if(!F.cedula||!F.nombre||!F.telefono)return toast('Completa los campos obligatorios');
  const l=S.A.CLIENTES.filter(c=>c.cedula!=F.cedula);l.push(F);if(await saveTable('CLIENTES',l)){S.A.CLIENTES=l;F=null;admin()}
}
async function delC(i){if(!confirm('¿Borrar cliente?'))return;const l=S.A.CLIENTES.filter((_,j)=>j!=i);if(await saveTable('CLIENTES',l)){S.A.CLIENTES=l;admin()}}
async function saveCfg(){
  const c={iva:$('#f1').value,whatsapp:$('#f2').value.replace(/\D/g,''),anuncio:$('#f3').value,hero:$('#f4').value,banco:$('#f5').value};
  if(await saveTable('CONFIGURACION',Object.keys(c).map(k=>({clave:k,valor:c[k]})))){
    S.A.config=c;const nk=$('#f6').value;if(nk){const r=await api({action:'setKey',key:S.key,newKey:nk});if(r.ok)S.key=nk}load();admin()}
}
addEventListener('hashchange',()=>{if(location.hash=='#admin')loginUI()});
load();if(location.hash=='#admin')loginUI();
</script></body></html>
