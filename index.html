<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROUMANS — Tienda Oficial</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#111;background:#fafafa}
#bar{background:#111;color:#fff;text-align:center;font-size:13px;padding:8px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:5}
header img{height:38px}button{cursor:pointer;font:inherit}
.b1{background:#111;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:600}.b2{background:#fff;border:1px solid #ccc;padding:7px 12px;border-radius:8px;margin:2px}
.hero{text-align:center;padding:60px 20px;background:#111;color:#fff}.hero h1{margin:0 0 20px;font-size:clamp(26px,5vw,44px)}.hero a{background:#fff;color:#111;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:700}
main{max-width:1100px;margin:auto;padding:30px 16px}.chips button{border:1px solid #ccc;background:#fff;border-radius:20px;padding:6px 14px;margin:0 6px 6px 0}.chips .on{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:14px}
.card{background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden;cursor:pointer}.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#eee;display:block}
.card div{padding:12px}.card small{color:#777}.pr{font-weight:700;font-size:18px}
footer{text-align:center;padding:30px;color:#777;font-size:13px}footer a{color:#555;margin:0 6px}
.ov{position:fixed;inset:0;background:#0008;display:none;z-index:20;overflow:auto}.ov>div{background:#fff;max-width:640px;margin:30px auto;padding:22px;border-radius:14px;position:relative}
.x{position:absolute;right:12px;top:8px;border:0;background:0;font-size:26px}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit;margin:3px 0 8px}label{font-size:13px;color:#555}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.th{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.th img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid #ddd;cursor:pointer}
.main-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
#adm{display:none;position:fixed;inset:0;background:#f4f4f4;z-index:30;overflow:auto}.top{background:#111;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.tb{background:0;border:0;color:#ccc;padding:6px 10px}.tb.on{color:#fff;border-bottom:2px solid #fff}.pad{padding:18px;max-width:1100px;margin:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}.kp div{background:#fff;padding:16px;border-radius:12px}.kp b{font-size:26px;display:block}
.tw{overflow-x:auto;background:#fff;border-radius:10px;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}th{background:#fafafa}
.fm{background:#fff;padding:16px;border-radius:12px;margin:10px 0}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;z-index:50;display:none}
</style></head><body>
<div id="bar"></div>
<header><img src="logo.png" alt="ROUMANS"><button class="b1" onclick="cartUI()">Bolsa (<span id="cn">0</span>)</button></header>
<section class="hero"><h1 id="hero"></h1><a href="#cat" onclick="document.getElementById('cat').scrollIntoView();return false">Explorar productos</a></section>
<main id="cat"><h2>Nuestros Productos</h2><div class="chips" id="chips"></div><div class="grid" id="grid"><p>Cargando…</p></div></main>
<footer>© 2026 ROUMANS. Todos los derechos reservados. <br><a href="https://www.facebook.com/61572463497545/" target="_blank">Facebook</a><a href="https://www.instagram.com/roumans.ec/" target="_blank">Instagram</a><a href="https://www.tiktok.com/@roumans.ec" target="_blank">TikTok</a><br><a href="#" onclick="loginUI();return false">Acceso administrador</a></footer>
<div class="ov" id="ov"><div id="ovc"></div></div><div id="adm"></div><div id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwZCEVOcMgCrp7p0eCaqMANx0IG8Fcxd9KdbQLVkuEXE_V0MSHv2270GV3St81R7k1l/exec'; // ← URL de implementación de Apps Script (termina en /exec)
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),m=n=>'$'+(+n||0).toFixed(2);
const S={p:[],cfg:{},cart:[],A:null,key:'',cat:'Todas'};
const api=o=>fetch(API,{method:'POST',body:JSON.stringify(o)}).then(r=>r.json()).catch(x=>({ok:0,error:'Sin conexión con la hoja'}));
const imgs=p=>{try{return Array.isArray(p.imagenes)?p.imagenes:JSON.parse(p.imagenes||'[]')}catch{return[]}};
const toast=t=>{const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',2800)};
const show=h=>{$('#ovc').innerHTML='<button class="x" onclick="hide()">×</button>'+h;$('#ov').style.display='block'},hide=()=>$('#ov').style.display='none';
const rz=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82).split(',')[1])};i.src=URL.createObjectURL(f)});
const now=()=>new Date().toLocaleString('sv').slice(0,16);
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}`).join('')}${r.map(x=>`<tr>${x.map(c=>`<td>${c}`).join('')}`).join('')}</table></div>`;

/* ===== TIENDA PÚBLICA ===== */
async function load(){
  if(API.startsWith('PEGA')){$('#grid').innerHTML='<p>Falta configurar la URL del Web App en index.html (const API).</p>';return}
  try{const r=await(await fetch(API)).json();S.p=r.productos;S.cfg=r.config;paint()}catch(x){$('#grid').innerHTML='<p>No se pudo cargar el catálogo.</p>'}
}
function paint(){
  $('#bar').textContent=S.cfg.anuncio||'';$('#hero').textContent=S.cfg.hero||'';
  const cats=['Todas',...new Set(S.p.map(p=>p.categoria).filter(Boolean))];
  $('#chips').innerHTML=cats.map(c=>`<button class="${c==S.cat?'on':''}" onclick="S.cat='${e(c)}';paint()">${e(c)}</button>`).join('');
  const l=S.p.filter(p=>S.cat=='Todas'||p.categoria==S.cat);
  $('#grid').innerHTML=l.map(p=>{const i=imgs(p)[0];return`<div class="card" onclick="prod('${e(p.sku)}')">${i?`<img src="${e(i)}" loading="lazy">`:'<div class="ph"></div>'}<div><small>${e(p.categoria)}</small><br>${e(p.nombre)}<br><span class="pr">${m(p.precio)}</span>${+p.stock<=0?' <small>Agotado</small>':''}</div></div>`}).join('')||'<p>Sin productos disponibles.</p>';
  $('#cn').textContent=S.cart.reduce((a,x)=>a+x.qty,0);
}
function prod(sku){
  const p=S.p.find(x=>x.sku==sku),im=imgs(p);
  show(`${im[0]?`<img class="main-img" id="mi" src="${e(im[0])}">`:''}<div class="th">${im.map(u=>`<img src="${e(u)}" onclick="$('#mi').src=this.src">`).join('')}</div>
  <small>${e(p.categoria)} · Código ${e(p.sku)}</small><h2>${e(p.nombre)}</h2><div class="pr">${m(p.precio)} USD</div><p>${e(p.descripcion)}</p>
  <label>Cantidad</label><input type="number" id="q" value="1" min="1" max="${+p.stock}">
  <button class="b1" ${+p.stock<=0?'disabled':''} onclick="add('${e(p.sku)}')">${+p.stock<=0?'Agotado':'Agregar a la bolsa'}</button>`);
}
function add(sku){
  const p=S.p.find(x=>x.sku==sku),q=Math.max(1,+$('#q').value||1),c=S.cart.find(x=>x.sku==sku);
  if((c?c.qty:0)+q>+p.stock)return toast('Stock disponible: '+p.stock);
  c?c.qty+=q:S.cart.push({sku,qty:q});hide();paint();toast('Agregado a la bolsa');
}
const tot=()=>{const s=S.cart.reduce((a,x)=>a+x.qty*S.p.find(p=>p.sku==x.sku).precio,0),i=s*(+S.cfg.iva||0)/100;return{s,i,t:s+i}};
function cartUI(){
  if(!S.cart.length)return show('<h2>Tu Bolsa ROUMANS</h2><p>Tu bolsa está vacía.</p>');
  const t=tot();
  show(`<h2>Tu Bolsa ROUMANS</h2>${S.cart.map((x,i)=>{const p=S.p.find(q=>q.sku==x.sku);return`<div class="row"><span>${e(p.nombre)}<br><small>${m(p.precio)}</small></span><span><button class="b2" onclick="qty(${i},-1)">−</button> ${x.qty} <button class="b2" onclick="qty(${i},1)">+</button></span></div>`}).join('')}
  <h3>Datos del cliente</h3><label>Cédula / RUC *</label><div style="display:flex;gap:6px"><input id="c1"><button class="b2" onclick="findC()">Buscar</button></div>
  <div class="g2"><div><label>Teléfono / WhatsApp *</label><input id="c2"></div><div><label>Nombres / Razón social *</label><input id="c3"></div></div>
  <label>Correo</label><input id="c4"><label>Método de pago *</label><select id="c5"><option>Transferencia Bancaria<option>Efectivo / Contra entrega<option>Tarjeta de Crédito / Débito</select>
  <pre style="background:#f4f4f4;padding:8px;border-radius:8px;white-space:pre-wrap">${e(S.cfg.banco)}</pre>
  <label>Dirección de entrega / Ciudad *</label><input id="c6"><label>Observación</label><input id="c7">
  <p>Subtotal ${m(t.s)}<br>IVA (${+S.cfg.iva||0}%) ${m(t.i)}<br><b style="font-size:20px">Total ${m(t.t)} USD</b></p>
  <button class="b1" id="ok" onclick="order()">Confirmar pedido</button>`);
}
function qty(i,d){const x=S.cart[i],p=S.p.find(q=>q.sku==x.sku);x.qty+=d;if(x.qty>+p.stock){x.qty=+p.stock;toast('Stock máximo')}if(x.qty<=0)S.cart.splice(i,1);paint();cartUI()}
async function findC(){const r=await api({action:'client',cedula:$('#c1').value.trim()});if(r.cliente){$('#c2').value=r.cliente.telefono;$('#c3').value=r.cliente.nombre;$('#c4').value=r.cliente.correo;$('#c6').value=r.cliente.direccion}else toast('Cliente nuevo')}
async function order(){
  const c={cedula:$('#c1').value.trim(),telefono:$('#c2').value.trim(),nombre:$('#c3').value.trim(),correo:$('#c4').value.trim(),direccion:$('#c6').value.trim()};
  if(!c.cedula||!c.telefono||!c.nombre||!c.direccion)return toast('Completa los campos obligatorios (*)');
  $('#ok').disabled=true;$('#ok').textContent='Procesando…';
  const r=await api({action:'order',cliente:c,items:S.cart,pago:$('#c5').value,obs:$('#c7').value,canal:'Web'});
  if(!r.ok){toast(r.error);$('#ok').disabled=false;$('#ok').textContent='Confirmar pedido';return}
  const txt=`Hola ROUMANS, pedido ${r.id}\nCliente: ${c.nombre} (${c.cedula})\n`+r.items.map(i=>`- ${i.qty} x ${i.nombre}`).join('\n')+`\nTotal: ${m(r.total)} USD\nPago: ${$('#c5').value}\nEntrega: ${c.direccion}`;
  S.cart=[];load();
  show(`<h2>¡Pedido registrado!</h2><p>N° ${e(r.id)} · Total ${m(r.total)} USD</p>${S.cfg.whatsapp?`<a class="b1" style="display:inline-block;text-decoration:none" target="_blank" href="https://wa.me/${e(S.cfg.whatsapp)}?text=${encodeURIComponent(txt)}">Enviar comprobante por WhatsApp</a>`:''} <button class="b2" onclick="hide()">Seguir comprando</button>`);
}

/* ===== ADMIN ===== */
function loginUI(){show('<h2>Acceso administrador</h2><label>Clave de acceso</label><input type="password" id="k" onkeydown="if(event.key==\'Enter\')login()"><button class="b1" onclick="login()">Ingresar</button>')}
async function login(){S.key=$('#k').value;if(!await adminLoad())return;hide();admin()}
async function adminLoad(){const r=await api({action:'admin',key:S.key});if(!r.ok){toast(r.error);return false}S.A=r;return true}
async function sync(){if(await adminLoad()){admin();load();toast('Sincronizado')}}
const TABS=['Resumen','Productos','Inventario','Ventas','Clientes','Config'];let tab='Resumen',F=null;
function admin(){
  $('#adm').style.display='block';
  $('#adm').innerHTML=`<div class="top"><b>ROUMANS ADMIN</b><span>${TABS.map(t=>`<button class="tb ${t==tab?'on':''}" onclick="tab='${t}';F=null;admin()">${t}</button>`).join('')}</span><span><button class="b2" onclick="sync()">Sincronizar</button><button class="b2" onclick="$('#adm').style.display='none'">Ver tienda</button></span></div><div class="pad">${V[tab]()}</div>`;
}
const kp=(a,b)=>`<div>${a}<b>${b}</b></div>`;
const inp=(k,l,t='text')=>`<div><label>${l}</label><input type="${t}" value="${e(F[k])}" oninput="F.${k}=this.value"></div>`;
const V={
Resumen(){const A=S.A,low=A.PRODUCTOS.filter(x=>+x.stock<=+x.minimo);
  return`<div class="kp">${kp('Ingresos por ventas',m(A.VENTAS.reduce((a,x)=>a+ +x.total,0)))}${kp('Valor inventario (costo)',m(A.PRODUCTOS.reduce((a,x)=>a+x.costo*x.stock,0)))}${kp('Alertas de stock bajo',low.length)}${kp('Clientes',A.CLIENTES.length)}</div><h3>Productos con stock bajo</h3>${tbl(['Producto','Stock','Mínimo'],low.map(x=>[e(x.nombre),x.stock,x.minimo]))}`},
Productos(){
  if(F)return`<div class="fm"><h3>${F._i!=null?'Editar':'Nuevo'} producto</h3><div class="g2">${inp('sku','Código SKU *')}${inp('barcode','Código de barras')}${inp('nombre','Nombre *')}${inp('categoria','Categoría *')}${inp('costo','Costo','number')}${inp('precio','Precio venta *','number')}${inp('stock','Stock actual *','number')}${inp('minimo','Stock mínimo','number')}${inp('unidad','Unidad')}</div>
  <label>Descripción</label><textarea rows="3" oninput="F.descripcion=this.value">${e(F.descripcion)}</textarea>
  <label><input type="checkbox" style="width:auto" ${F.visible=='SI'?'checked':''} onchange="F.visible=this.checked?'SI':'NO'"> Visible en tienda pública</label>
  <h4>Galería (${F.imagenes.length}/8) — la #1 es la portada</h4><div class="th">${F.imagenes.map((u,i)=>`<div><img src="${e(u)}"><br><button class="b2" onclick="F.imagenes.splice(${i},1);admin()">Quitar</button>${i?`<button class="b2" onclick="F.imagenes.unshift(F.imagenes.splice(${i},1)[0]);admin()">★</button>`:''}</div>`).join('')}</div>
  <input type="file" accept="image/*" multiple onchange="up(this)"><div style="display:flex;gap:6px"><input id="url" placeholder="o pega un enlace de imagen (URL)"><button class="b2" onclick="if($('#url').value&&F.imagenes.length<8){F.imagenes.push($('#url').value);admin()}">Añadir</button></div>
  <button class="b1" onclick="saveP()">Guardar producto</button> <button class="b2" onclick="F=null;admin()">Cancelar</button></div>`;
  return`<button class="b1" onclick="F={visible:'SI',unidad:'Unidad',imagenes:[]};admin()">+ Nuevo producto</button>`+tbl(['','SKU','Producto','Categoría','Fotos','Precio','Stock',''],S.A.PRODUCTOS.map((x,i)=>[imgs(x)[0]?`<img src="${e(imgs(x)[0])}" width="40">`:'',e(x.sku),e(x.nombre),e(x.categoria),imgs(x).length,m(x.precio),x.stock,`<button class="b2" onclick="F={...S.A.PRODUCTOS[${i}],imagenes:imgs(S.A.PRODUCTOS[${i}]),_i:${i}};admin()">Editar</button><button class="b2" onclick="delP(${i})">Borrar</button>`]))},
Inventario(){const A=S.A;
  return`<div class="fm"><h3>Movimiento de inventario</h3><div class="g2"><div><label>Producto</label><select id="as">${A.PRODUCTOS.map(p=>`<option value="${e(p.sku)}">${e(p.nombre)} (stock ${p.stock})`).join('')}</select></div><div><label>Tipo</label><select id="at"><option value="ENTRADA">ENTRADA (+)<option value="SALIDA">SALIDA (−)<option value="AJUSTE">FIJAR STOCK EXACTO</select></div><div><label>Cantidad</label><input type="number" id="aq"></div><div><label>Motivo</label><input id="am"></div></div><button class="b1" onclick="adj()">Aplicar ajuste</button></div>
  <h3>Kardex</h3>${tbl(['Fecha','Producto','Tipo','Cant.','Anterior → Nuevo','Motivo'],[...A.KARDEX].reverse().slice(0,200).map(k=>[e(k.fecha),e(k.producto),e(k.tipo),k.cantidad,k.anterior+' → '+k.nuevo,e(k.motivo)]))}`},
Ventas(){const A=S.A;
  return`<div class="fm"><h3>Venta directa (mostrador)</h3><div class="g2"><div><label>Cédula / RUC</label><input id="v1"></div><div><label>Cliente</label><input id="v2" value="Consumidor final"></div><div><label>Producto</label><select id="v3">${A.PRODUCTOS.map(p=>`<option value="${e(p.sku)}">${e(p.nombre)} (${p.stock})`).join('')}</select></div><div><label>Cantidad</label><input type="number" id="v4" value="1"></div><div><label>Pago</label><select id="v5"><option>Efectivo<option>Transferencia<option>Tarjeta</select></div></div><button class="b1" onclick="manual()">Emitir venta y descontar stock</button></div>
  ${tbl(['N°','Fecha','Cliente','Artículos','Pago','Total','Estado'],[...A.VENTAS].reverse().map(v=>{let it='';try{it=JSON.parse(v.items).map(i=>i.qty+'× '+i.nombre).join(', ')}catch{}return[e(v.id),e(v.fecha),e(v.cliente),e(it),e(v.pago),m(v.total),`<button class="b2" onclick="est('${e(v.id)}')">${e(v.estado)}</button>`]}))}`},
Clientes(){
  if(!F)F={cedula:'',nombre:'',telefono:'',correo:'',direccion:''};
  return`<div class="fm"><h3>Crear / editar cliente</h3><div class="g2">${inp('cedula','Cédula / RUC *')}${inp('nombre','Nombres / Razón social *')}${inp('telefono','Teléfono *')}${inp('correo','Correo')}${inp('direccion','Dirección')}</div><button class="b1" onclick="saveC()">Guardar cliente</button></div>`+tbl(['Cédula','Nombres','Teléfono','Correo','Dirección',''],S.A.CLIENTES.map((c,i)=>[e(c.cedula),e(c.nombre),e(c.telefono),e(c.correo),e(c.direccion),`<button class="b2" onclick="F={...S.A.CLIENTES[${i}]};admin()">Editar</button><button class="b2" onclick="delC(${i})">Borrar</button>`]))},
Config(){const c=S.A.config;
  return`<div class="fm"><h3>Configuración de la tienda</h3><label>Impuesto IVA (%)</label><input id="f1" type="number" value="${e(c.iva)}"><label>WhatsApp pedidos (con código país, ej. 593999999999)</label><input id="f2" value="${e(c.whatsapp)}"><label>Barra de anuncio</label><input id="f3" value="${e(c.anuncio)}"><label>Título principal</label><input id="f4" value="${e(c.hero)}"><label>Datos bancarios</label><textarea id="f5" rows="4">${e(c.banco)}</textarea><label>Nueva clave de administrador (vacío = no cambiar)</label><input id="f6" type="password"><button class="b1" onclick="saveCfg()">Guardar configuración</button></div>`}
};
async function up(inp){
  for(const f of [...inp.files]){if(F.imagenes.length>=8)break;toast('Subiendo imagen…');const r=await api({action:'upload',key:S.key,data:await rz(f)});r.ok?F.imagenes.push(r.url):toast(r.error)}admin();
}
async function saveTable(t,rows){const r=await api({action:'save',key:S.key,table:t,rows});if(!r.ok)toast(r.error);else toast('Guardado');return r.ok}
async function saveP(){
  if(!F.sku||!F.nombre||F.precio==null)return toast('Completa SKU, nombre y precio');
  const o={...F,imagenes:JSON.stringify(F.imagenes)};delete o._i;const l=[...S.A.PRODUCTOS];
  if(F._i!=null)l[F._i]=o;else if(l.some(x=>x.sku==o.sku))return toast('SKU repetido');else l.push(o);
  if(await saveTable('PRODUCTOS',l)){S.A.PRODUCTOS=l;F=null;admin();load()}
}
async function delP(i){if(!confirm('¿Borrar producto?'))return;const l=S.A.PRODUCTOS.filter((_,j)=>j!=i);if(await saveTable('PRODUCTOS',l)){S.A.PRODUCTOS=l;admin();load()}}
async function adj(){
  const p=S.A.PRODUCTOS.find(x=>x.sku==$('#as').value),t=$('#at').value,q=+$('#aq').value;if(!p||isNaN(q)||$('#aq').value==='')return toast('Indica la cantidad');
  const a=+p.stock,n=t=='ENTRADA'?a+q:t=='SALIDA'?a-q:q;if(n<0)return toast('Stock no puede ser negativo');p.stock=n;
  const k={fecha:now(),sku:p.sku,producto:p.nombre,tipo:t,cantidad:q,anterior:a,nuevo:n,motivo:$('#am').value||'Ajuste manual'};
  if(await saveTable('PRODUCTOS',S.A.PRODUCTOS)){await api({action:'append',key:S.key,table:'KARDEX',rows:[k]});S.A.KARDEX.push(k);admin();load()}
}
async function manual(){
  const r=await api({action:'order',canal:'Mostrador',pago:$('#v5').value,cliente:{cedula:$('#v1').value.trim(),nombre:$('#v2').value},items:[{sku:$('#v3').value,qty:+$('#v4').value}]});
  if(!r.ok)return toast(r.error);toast('Venta '+r.id+' registrada');await adminLoad();admin();load()
}
async function est(id){const l=S.A.VENTAS,v=l.find(x=>x.id==id);v.estado=v.estado=='Pendiente'?'Entregado':'Pendiente';if(await saveTable('VENTAS',l))admin()}
async function saveC(){
  if(!F.cedula||!F.nombre||!F.telefono)return toast('Completa los campos obligatorios');
  const l=S.A.CLIENTES.filter(c=>c.cedula!=F.cedula);l.push(F);if(await saveTable('CLIENTES',l)){S.A.CLIENTES=l;F=null;admin()}
}
async function delC(i){if(!confirm('¿Borrar cliente?'))return;const l=S.A.CLIENTES.filter((_,j)=>j!=i);if(await saveTable('CLIENTES',l)){S.A.CLIENTES=l;admin()}}
async function saveCfg(){
  const c={iva:$('#f1').value,whatsapp:$('#f2').value.replace(/\D/g,''),anuncio:$('#f3').value,hero:$('#f4').value,banco:$('#f5').value};
  if(await saveTable('CONFIGURACION',Object.keys(c).map(k=>({clave:k,valor:c[k]})))){
    S.A.config=c;const nk=$('#f6').value;if(nk){const r=await api({action:'setKey',key:S.key,newKey:nk});if(r.ok)S.key=nk}load();admin()}
}
load();if(location.hash=='#admin')loginUI();
</script></body></html>
