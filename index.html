function prod(sku){
  const p=S.p.find(x=>x.sku==sku),im=imgs(p),co=cols(p),inf=infoOf(sku);CP=p;SEL=(co[0]||{}).n||'';
  show(`<div class="pg"><div>${im[0]?`<img class="main-img" id="mi" src="${e(im[0])}">`:''}<div class="th">${im.map(u=>`<img src="${e(u)}" onclick="$('#mi').src=this.src">`).join('')}</div></div>

function selCol(i){SEL=cols(CP)[i].n;document.querySelectorAll('#cs .sw').forEach((b,j)=>b.classList.toggle('on',j==i))}
function quick(sku){const p=S.p.find(x=>x.sku==sku);if(cols(p).length)return prod(sku);const c=S.cart.find(x=>x.sku==sku&&!x.color);if((c?c.qty:0)+1>+p.stock)return toast('Stock disponible: '+p.stock);c?c.qty++:S.cart.push({sku,qty:1});paint();toast('Agregado a la bolsa')}
function add(sku){
  const p=S.p.find(x=>x.sku==sku),q=Math.max(1,+$('#q').value||1),color=SEL,c=S.cart.find(x=>x.sku==sku&&(x.color||'')==color),tq=S.cart.filter(x=>x.sku==sku).reduce((a,x)=>a+x.qty,0);
  if(tq+q>+p.stock)return toast('Stock disponible: '+p.stock);

}

async function trackOrder(){
  let id=$('#tk').value.trim().toUpperCase().replace(/\s/g,'');const out=$('#tkr');
  if(!id)return toast('Escribe el número de venta');
  if(/^\d+$/.test(id))id='VTA-'+id.padStart(4,'0');
  out.innerHTML='<p style="margin-top:12px">Buscando…</p>';
  const r=await api({action:'track',id});
  if(!r.ok){out.innerHTML=`<p class="tke" style="margin-top:12px">${e(r.error||'No se pudo consultar el pedido')}</p>`;return}
  const cur=Math.max(0,ESTS.indexOf(nEst(r.estado))),et=Array.isArray(r.etapas)?r.etapas:[];
  const st=ESTS.map((n,i)=>({n,i})).filter(x=>[0,1,4].includes(x.i)||et.includes(x.n)||x.i==cur);
  out.innerHTML=`<p style="margin:14px 0 0;color:#0f1c2e"><b>Pedido ${e(r.id)}</b>${r.fecha?' · '+e(r.fecha):''}</p><ul class="tl2">${st.map(x=>{const c=cur==4||x.i<cur?'done':x.i==cur?'cur':'todo';
    return`<li class="${c}"><i>${c=='done'?'✓':''}</i>${e(x.n)}${x.i==2&&r.guia?`<small><span class="gz"># Guía: ${e(r.guia)}</span></small>`:''}</li>`}).join('')}</ul>`;
}

  d.text(v.inc?'Subtotal (sin IVA)':'Subtotal',150,y,{align:'right'}).text(m(v.sub),192,y,{align:'right'});y+=6;
  d.text('IVA ('+ivaR()+'%'+(v.inc?' incluido':'')+')',150,y,{align:'right'}).text(m(v.iva),192,y,{align:'right'});y+=6;
  if(v.zona){d.text('Envío ('+v.zona+')',150,y,{align:'right'}).text(+v.envio?m(v.envio):'Gratis',192,y,{align:'right'});y+=6}y+=2;
  d.setFont('helvetica','bold').setFontSize(13).text('TOTAL',150,y,{align:'right'}).text(m(v.total)+' USD',192,y,{align:'right'});y+=10;
  if(v.obs){d.setFont('helvetica','normal').setFontSize(10).text(d.splitTextToSize('Observación: '+v.obs,180),15,y);y+=10}
  d.setFont('helvetica','normal').setFontSize(9).setTextColor(110);
  const w=String(S.cfg.whatsapp||'').replace(/\D/g,'');
  d.text('Gracias por tu compra en ROUMANS'+(w?'  ·  WhatsApp: +'+w:'')+'  ·  @roumans.ec',105,285,{align:'center'});
  d.save('Comprobante-'+v.id+'.pdf');
}
function pdfV(id){const v=S.A.VENTAS.find(x=>x.id==id);let it=[];try{it=JSON.parse(v.items)}catch{}
  pdf({id:v.id,fecha:v.fecha,cli:{nombre:v.cliente,cedula:v.cedula,telefono:v.telefono,direccion:v.direccion},items:it,pago:v.pago,obs:v.obs,sub:+v.subtotal,iva:+v.iva,total:+v.total,inc:v.ivainc==='SI'?1:0,envio:+v.envio||0,zona:v.zona||''})}

/* ===== ADMIN ===== */
function loginUI(){show('<h2>Acceso administrador</h2><label>Clave de acceso</label><input type="password" id="k" onkeydown="if(event.key==\'Enter\')login()"><button class="b1" onclick="login()">Ingresar</button>')}
async function login(){S.key=$('#k').value;if(!await adminLoad())return;hide();admin()}
async function adminLoad(){const r=await api({action:'admin',key:S.key});if(!r.ok){toast(r.error);return false}S.A=r;return true}
async function sync(){if(await adminLoad()){admin();load();toast('Sincronizado')}}
const TABS=['Resumen','Productos','Inventario','Ventas','Clientes','Config'];let tab='Resumen',F=null,PM=null,CD=null;
function admin(){
  $('#adm').style.display='block';
  $('#adm').innerHTML=`<div class="top"><b>ROUMANS ADMIN</b><span>${TABS.map(t=>`<button class="tb ${t==tab?'on':''}" onclick="tab='${t}';F=null;PM=null;CD=null;admin()">${t}</button>`).join('')}</span><span><button class="b2" onclick="sync()">Sincronizar</button><button class="b2" onclick="$('#adm').style.display='none';history.replaceState(null,'',location.pathname)">Ver tienda</button></span></div><div class="pad">${V[tab]()}</div>`;
}
const kp=(a,b)=>`<div>${a}<b>${b}</b></div>`;
const inp=(k,l,t='text')=>`<div><label>${l}</label><input type="${t}" value="${e(F[k])}" oninput="F.${k}=this.value"></div>`;
const V={
Resumen(){const A=S.A,low=A.PRODUCTOS.filter(x=>+x.stock<=+x.minimo);
  return`<div class="kp">${kp('Ingresos por ventas',m(A.VENTAS.reduce((a,x)=>a+ +x.total,0)))}${kp('Valor inventario (costo)',m(A.PRODUCTOS.reduce((a,x)=>a+x.costo*x.stock,0)))}${kp('Alertas de stock bajo',low.length)}${kp('Clientes',A.CLIENTES.length)}</div><h3>Productos con stock bajo</h3>${tbl(['Producto','Stock','Mínimo'],low.map(x=>[e(x.nombre),x.stock,x.minimo]))}`},
Productos(){
  if(F)return`<div class="fm"><h3>${F._i!=null?'Editar':'Nuevo'} producto</h3><div class="g2">${inp('sku','Código SKU *')}${inp('barcode','Código de barras')}${inp('nombre','Nombre *')}${inp('categoria','Categoría *')}${inp('costo','Costo','number')}${inp('precio','Precio venta (IVA incluido) *','number')}${inp('stock','Stock actual *','number')}${inp('minimo','Stock mínimo','number')}${inp('unidad','Unidad')}</div>
  <label>Descripción (se respetan los saltos de línea; usa **texto** para negrita)</label><textarea rows="7" oninput="F.descripcion=this.value">${e(F.descripcion)}</textarea>
  <h4>Información del producto</h4><small>Secciones que se muestran debajo del producto (ej. Materiales, Medidas, Cuidados). Admiten saltos de línea y **negrita**.</small>
  ${(F.info||[]).map((x,i)=>`<div class="fm" style="background:#f4f4f6;margin:8px 0"><label>Título</label><input value="${e(x.t)}" oninput="F.info[${i}].t=this.value" placeholder="Ej. Materiales"><label>Contenido</label><textarea rows="4" oninput="F.info[${i}].c=this.value">${e(x.c)}</textarea><button class="b2" onclick="F.info.splice(${i},1);admin()">Quitar sección</button></div>`).join('')}
  <button class="b2" onclick="F.info=F.info||[];F.info.push({t:'',c:''});admin()">+ Añadir sección de información</button>
  <h4>Colores disponibles</h4><div class="th">${F.colores.map((c,i)=>`<span class="sw"><i style="background:${e(c.h)}"></i>${e(c.n)} <button class="b2" onclick="F.colores.splice(${i},1);admin()">×</button></span>`).join('')||'<small>Sin colores (opcional)</small>'}</div>
  <div style="display:flex;gap:6px"><input type="color" id="chx" value="#000000" style="width:56px;padding:2px"><input id="chn" placeholder="Nombre del color (ej. Negro)" onkeydown="if(event.key=='Enter')addCol()"><button class="b2" onclick="addCol()">+ Añadir color</button></div>
  <label><input type="checkbox" style="width:auto" ${F.visible=='SI'?'checked':''} onchange="F.visible=this.checked?'SI':'NO'"> Visible en tienda pública</label>
  <h4>Galería (${F.imagenes.length}/8) — la #1 es la portada</h4><div class="th">${F.imagenes.map((u,i)=>`<div><img src="${e(u)}"><br><button class="b2" onclick="F.imagenes.splice(${i},1);admin()">Quitar</button>${i?`<button class="b2" onclick="F.imagenes.unshift(F.imagenes.splice(${i},1)[0]);admin()">★</button>`:''}</div>`).join('')}</div>
  <input type="file" accept="image/*" multiple onchange="up(this)"><div style="display:flex;gap:6px"><input id="url" placeholder="o pega un enlace de imagen (URL)"><button class="b2" onclick="if($('#url').value&&F.imagenes.length<8){F.imagenes.push($('#url').value);admin()}">Añadir</button></div>
  <button class="b1" onclick="saveP()">Guardar producto</button> <button class="b2" onclick="saveP(true)">Guardar y añadir otro (+)</button> <button class="b2" onclick="F=null;admin()">Cancelar</button></div>`;
  return`<button class="b1" onclick="F={visible:'SI',unidad:'Unidad',imagenes:[],colores:[],info:[]};admin()">+ Nuevo producto</button>`+tbl(['','SKU','Producto','Categoría','Fotos','Precio','Stock',''],S.A.PRODUCTOS.map((x,i)=>[imgs(x)[0]?`<img src="${e(imgs(x)[0])}" width="40">`:'',e(x.sku),e(x.nombre),e(x.categoria),imgs(x).length,m(x.precio),x.stock,`<button class="b2" onclick="F={...S.A.PRODUCTOS[${i}],imagenes:imgs(S.A.PRODUCTOS[${i}]),colores:cols(S.A.PRODUCTOS[${i}]),info:infoOf(S.A.PRODUCTOS[${i}].sku,S.A.config),_i:${i}};admin()">Editar</button><button class="b2" onclick="delP(${i})">Borrar</button>`]))},
Inventario(){const A=S.A;
  return`<div class="fm"><h3>Movimiento de inventario</h3><div class="g2"><div><label>Producto</label><select id="as">${A.PRODUCTOS.map(p=>`<option value="${e(p.sku)}">${e(p.nombre)} (stock ${p.stock})`).join('')}</select></div><div><label>Tipo</label><select id="at"><option value="ENTRADA">ENTRADA (+)<option value="SALIDA">SALIDA (−)<option value="AJUSTE">FIJAR STOCK EXACTO</select></div><div><label>Cantidad</label><input type="number" id="aq"></div><div><label>Motivo</label><input id="am"></div></div><button class="b1" onclick="adj()">Aplicar ajuste</button></div>
  <h3>Kardex</h3>${tbl(['Fecha','Producto','Tipo','Cant.','Anterior → Nuevo','Motivo'],[...A.KARDEX].reverse().slice(0,200).map(k=>[e(k.fecha),e(k.producto),e(k.tipo),k.cantidad,k.anterior+' → '+k.nuevo,e(k.motivo)]))}`},
Ventas(){const A=S.A;
  return`<div class="fm"><h3>Venta directa (mostrador)</h3><div class="g2"><div><label>Cédula / RUC</label><input id="v1"></div><div><label>Cliente</label><input id="v2" value="Consumidor final"></div><div><label>Producto</label><select id="v3">${A.PRODUCTOS.map(p=>`<option value="${e(p.sku)}">${e(p.nombre)} (${p.stock})`).join('')}</select></div><div><label>Cantidad</label><input type="number" id="v4" value="1"></div><div><label>Pago</label><select id="v5"><option>Efectivo<option>Transferencia<option>Tarjeta</select></div></div><button class="b1" onclick="manual()">Emitir venta y descontar stock</button></div>
  ${tbl(['N°','Fecha','Cliente','Artículos','Pago','Total','Estado','# Guía','Comprobante'],[...A.VENTAS].reverse().map(v=>{let it='';try{it=JSON.parse(v.items).map(i=>i.qty+'× '+i.nombre+(i.color?' ('+i.color+')':'')).join(', ')}catch{}return[e(v.id),e(v.fecha),e(v.cliente),e(it),e(v.pago),m(v.total),`<select class="es" onchange="setEst('${e(v.id)}',this.value)">${ESTS.map(x=>`<option ${x==nEst(v.estado)?'selected':''}>${x}</option>`).join('')}</select>`,`<input class="gi" value="${e(v.guia)}" placeholder="# Guía" onchange="setGuia('${e(v.id)}',this.value)">`,`<button class="b2" onclick="pdfV('${e(v.id)}')">PDF</button>${v.comprobante?`<a class="b2" style="text-decoration:none;color:inherit;display:inline-block" href="${e(v.comprobante)}" target="_blank" rel="noopener">Guardado</a>`:''}`]}))}`},
Clientes(){
  if(!F)F={cedula:'',nombre:'',telefono:'',correo:'',direccion:''};
  return`<div class="fm"><h3>Crear / editar cliente</h3><div class="g2">${inp('cedula','Cédula / RUC *')}${inp('nombre','Nombres / Razón social *')}${inp('telefono','Teléfono *')}${inp('correo','Correo')}${inp('direccion','Dirección')}</div><button class="b1" onclick="saveC()">Guardar cliente</button></div>`+tbl(['Cédula','Nombres','Teléfono','Correo','Dirección',''],S.A.CLIENTES.map((c,i)=>[e(c.cedula),e(c.nombre),e(c.telefono),e(c.correo),e(c.direccion),`<button class="b2" onclick="F={...S.A.CLIENTES[${i}]};admin()">Editar</button><button class="b2" onclick="delC(${i})">Borrar</button>`]))},
Config(){const c={...S.A.config,...(CD||{})};if(!PM)PM=payList(S.A.config);
  return`<div class="fm"><h3>Configuración de la tienda</h3><label>Impuesto IVA (%) — ya incluido en los precios de venta</label><input id="f1" type="number" value="${e(c.iva)}"><label>WhatsApp de la tienda — soporte, icono público y pedidos (con código de país, ej. 593999999999)</label><input id="f2" value="${e(c.whatsapp)}"><label>Barra de anuncio</label><input id="f3" value="${e(c.anuncio)}"><label>Título principal</label><input id="f4" value="${e(c.hero)}">
  <h4>Costos de envío</h4><div class="g2"><div><label>Provincia de Pichincha ($)</label><input id="f7" type="number" step="0.01" value="${e(String(c.envio_pichincha??3.5))}"></div><div><label>Resto de Provincias ($)</label><input id="f8" type="number" step="0.01" value="${e(String(c.envio_resto??7))}"></div><div><label>Provincia de Galápagos ($)</label><input id="f9" type="number" step="0.01" value="${e(String(c.envio_galapagos??12))}"></div><div><label>Envío gratis desde ($)</label><input id="f10" type="number" step="0.01" value="${e(String(c.envio_gratis??100))}"></div></div>
  <h4>Retiro en local</h4><small>Si el cliente elige “Retiro en local”, el envío será GRATIS y verá estos datos.</small><div class="g2"><div><label>Nombre del local</label><input id="f11" value="${e(c.retiro_nombre)}" placeholder="Ej. Roumans - Machachi"></div><div><label>Google Maps (enlace o dirección)</label><input id="f12" value="${e(c.retiro_maps)}" placeholder="https://maps.app.goo.gl/..."></div></div>
  <h4>Métodos de pago que ve el cliente</h4><small>Marca los que quieres ofrecer en el carrito. Lo que escribas en “Instrucciones” se muestra al cliente al elegir ese método.</small>
  ${PM.map((x,i)=>`<div class="pm"><input type="checkbox" style="width:auto" ${x.on?'checked':''} onchange="PM[${i}].on=this.checked?1:0" aria-label="Mostrar en la tienda"><input type="text" value="${e(x.n)}" oninput="PM[${i}].n=this.value" placeholder="Nombre del método"><button class="b2" onclick="pmDel(${i})" aria-label="Quitar">×</button><div class="pi">${x.t=='banco'?'<small>Muestra los “Datos bancarios” de abajo.</small>':`<input type="text" value="${e(x.info)}" oninput="PM[${i}].info=this.value" placeholder="Instrucciones (opcional)">`}</div></div>`).join('')}
  <button class="b2" onclick="pmAdd()">+ Añadir método de pago</button>
  <label style="display:block;margin-top:12px">Datos bancarios (se muestran al elegir Transferencia)</label><textarea id="f5" rows="4">${e(c.banco)}</textarea><label>Nueva clave de administrador (vacío = no cambiar)</label><input id="f6" type="password"><button class="b1" onclick="saveCfg()">Guardar configuración</button></div>`}
};
function addCol(){const n=$('#chn').value.trim();if(!n)return toast('Escribe el nombre del color');F.colores.push({n,h:$('#chx').value});admin()}
async function up(inp){
  for(const f of [...inp.files]){if(F.imagenes.length>=8)break;toast('Subiendo imagen…');const r=await api({action:'upload',key:S.key,data:await rz(f)});r.ok?F.imagenes.push(r.url):toast(r.error)}admin();
}
async function saveTable(t,rows){const r=await api({action:'save',key:S.key,table:t,rows});if(!r.ok)toast(r.error);else toast('Guardado');return r.ok}
const cfgRows=c=>Object.keys(c).map(k=>({clave:k,valor:c[k]}));
async function saveInfo(M){const c={...S.A.config,info_productos:JSON.stringify(M)};if((S.A.config.info_productos||'{}')==c.info_productos)return true;if(await saveTable('CONFIGURACION',cfgRows(c))){S.A.config=c;return true}return false}
async function saveP(more){
  if(!F.sku||!F.nombre||F.precio==null)return toast('Completa SKU, nombre y precio');
  const o={...F,imagenes:JSON.stringify(F.imagenes),colores:JSON.stringify(F.colores)};delete o._i;delete o.info;const l=[...S.A.PRODUCTOS],old=F._i!=null?S.A.PRODUCTOS[F._i].sku:null,
    inf=(F.info||[]).map(x=>({t:String(x.t||'').trim(),c:String(x.c||'').trim()})).filter(x=>x.t||x.c);
  if(F._i!=null)l[F._i]=o;else if(l.some(x=>x.sku==o.sku))return toast('SKU repetido');else l.push(o);
  if(await saveTable('PRODUCTOS',l)){S.A.PRODUCTOS=l;
    const M=infoMap(S.A.config);if(old&&old!=o.sku)delete M[old];if(inf.length)M[o.sku]=inf;else delete M[o.sku];
    await saveInfo(M);
    F=more?{visible:'SI',unidad:'Unidad',imagenes:[],colores:[],info:[]}:null;admin();load()}
}
async function delP(i){if(!confirm('¿Borrar producto?'))return;const sku=S.A.PRODUCTOS[i].sku,l=S.A.PRODUCTOS.filter((_,j)=>j!=i);if(await saveTable('PRODUCTOS',l)){S.A.PRODUCTOS=l;const M=infoMap(S.A.config);if(M[sku]){delete M[sku];await saveInfo(M)}admin();load()}}
async function adj(){
  const p=S.A.PRODUCTOS.find(x=>x.sku==$('#as').value),t=$('#at').value,q=+$('#aq').value;if(!p||isNaN(q)||$('#aq').value==='')return toast('Indica la cantidad');
  const a=+p.stock,n=t=='ENTRADA'?a+q:t=='SALIDA'?a-q:q;if(n<0)return toast('Stock no puede ser negativo');p.stock=n;
  const k={fecha:now(),sku:p.sku,producto:p.nombre,tipo:t,cantidad:q,anterior:a,nuevo:n,motivo:$('#am').value||'Ajuste manual'};
  if(await saveTable('PRODUCTOS',S.A.PRODUCTOS)){await api({action:'append',key:S.key,table:'KARDEX',rows:[k]});S.A.KARDEX.push(k);admin();load()}
}
async function manual(){
  const r=await api({action:'order',key:S.key,canal:'Mostrador',pago:$('#v5').value,cliente:{cedula:$('#v1').value.trim(),nombre:$('#v2').value},items:[{sku:$('#v3').value,qty:+$('#v4').value}]});
  if(!r.ok)return toast(r.error);toast('Venta '+r.id+' registrada');await adminLoad();admin();load()
}
async function setEst(id,val){const l=S.A.VENTAS,v=l.find(x=>x.id==id),i=ESTS.indexOf(val);let et=[];try{et=JSON.parse(v.etapas||'[]')}catch{}
  et=et.filter(n=>ESTS.indexOf(n)<=i);if((i==2||i==3)&&!et.includes(val))et.push(val);
  v.estado=val;v.etapas=JSON.stringify(et);if(await saveTable('VENTAS',l))admin()}
async function setGuia(id,val){const l=S.A.VENTAS,v=l.find(x=>x.id==id);v.guia=val.trim();if(await saveTable('VENTAS',l))toast('Guía guardada')}
async function saveC(){
  if(!F.cedula||!F.nombre||!F.telefono)return toast('Completa los campos obligatorios');
  const l=S.A.CLIENTES.filter(c=>c.cedula!=F.cedula);l.push(F);if(await saveTable('CLIENTES',l)){S.A.CLIENTES=l;F=null;admin()}
}
async function delC(i){if(!confirm('¿Borrar cliente?'))return;const l=S.A.CLIENTES.filter((_,j)=>j!=i);if(await saveTable('CLIENTES',l)){S.A.CLIENTES=l;admin()}}
const draftCfg=()=>{if($('#f1'))CD={iva:$('#f1').value,whatsapp:$('#f2').value,anuncio:$('#f3').value,hero:$('#f4').value,banco:$('#f5').value,envio_pichincha:$('#f7').value,envio_resto:$('#f8').value,envio_galapagos:$('#f9').value,envio_gratis:$('#f10').value,retiro_nombre:$('#f11').value,retiro_maps:$('#f12').value}};
function pmAdd(){draftCfg();PM.push({n:'',on:1,t:'',info:''});admin()}
function pmDel(i){draftCfg();PM.splice(i,1);admin()}
async function saveCfg(){
  const pays=(PM||payList(S.A.config)).filter(x=>x.n.trim());
  if(!pays.some(x=>x.on))return toast('Activa al menos un método de pago');
  const c={...S.A.config,iva:$('#f1').value,whatsapp:$('#f2').value.replace(/\D/g,''),anuncio:$('#f3').value,hero:$('#f4').value,banco:$('#f5').value,envio_pichincha:$('#f7').value,envio_resto:$('#f8').value,envio_galapagos:$('#f9').value,envio_gratis:$('#f10').value,retiro_nombre:$('#f11').value,retiro_maps:$('#f12').value,pagos:JSON.stringify(pays)};
  if(await saveTable('CONFIGURACION',Object.keys(c).map(k=>({clave:k,valor:c[k]})))){
    S.A.config=c;PM=null;CD=null;const nk=$('#f6').value;if(nk){const r=await api({action:'setKey',key:S.key,newKey:nk});if(r.ok)S.key=nk}load();admin()}
}
addEventListener('hashchange',()=>{if(location.hash=='#admin')loginUI()});
load();if(location.hash=='#admin')loginUI();
</script></body></html>
